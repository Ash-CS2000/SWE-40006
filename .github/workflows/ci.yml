name: TaskFlow CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://postgres:ci_password@127.0.0.1:5432/taskflow_test
      SESSION_SECRET: taskflow-ci-only-session-secret
      APP_VERSION: ${{ github.sha }}
      CI: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node --test tests/unit.test.js

      - name: Run PostgreSQL integration tests
        env:
          NODE_ENV: test
        run: node --test tests/integration.test.js

      - name: Build image with source commit tag
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "taskflow:$GITHUB_SHA" .

      - name: Start container
        run: |
          docker run --detach --name taskflow-ci --network host \
            --env DATABASE_URL --env SESSION_SECRET --env APP_VERSION \
            --env PORT=3000 "taskflow:$GITHUB_SHA"

      - name: Verify container health and version
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 2 --retry-connrefused \
            --connect-timeout 2 --max-time 5 --retry-max-time 90 \
            http://127.0.0.1:3000/health > health.json
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          assert.equal(health.status, 'ok');
          assert.equal(health.database, 'connected');
          assert.equal(health.version, process.env.GITHUB_SHA);
          console.log('Container health, PostgreSQL connection and source version verified.');
          JS
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:3000/login > /dev/null

      - name: Run container smoke tests
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_EXPECTED_VERSION: ${{ github.sha }}
        run: node --test tests/smoke-test.js

      # Push the same image that passed the checks above.
      - name: Publish tested image to private Docker Hub
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_IMAGE:?Set the DOCKERHUB_IMAGE repository variable}"
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository variable}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN repository secret}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" --password-stdin
          docker tag "taskflow:$GITHUB_SHA" "$DOCKERHUB_IMAGE:$GITHUB_SHA"
          docker push "$DOCKERHUB_IMAGE:$GITHUB_SHA"

      - name: Show container logs
        if: ${{ always() }}
        run: |
          if docker container inspect taskflow-ci > /dev/null 2>&1; then
            docker logs taskflow-ci
          fi

      - name: Clean up
        if: ${{ always() }}
        run: |
          if docker container inspect taskflow-ci > /dev/null 2>&1; then
            docker rm --force taskflow-ci
          fi
          docker logout
