name: TaskFlow CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://postgres:ci_password@127.0.0.1:5432/taskflow_test
      SESSION_SECRET: taskflow-ci-only-session-secret
      APP_VERSION: ${{ github.sha }}
      CI: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node --test tests/unit.test.js

      - name: Run PostgreSQL integration tests
        env:
          NODE_ENV: test
        run: node --test tests/integration.test.js

      - name: Build image with source commit tag
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "taskflow:$GITHUB_SHA" .

      - name: Start container
        run: |
          docker run --detach --name taskflow-ci --network host \
            --env DATABASE_URL --env SESSION_SECRET --env APP_VERSION \
            --env PORT=3000 "taskflow:$GITHUB_SHA"

      - name: Verify container health and version
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 2 --retry-connrefused \
            --connect-timeout 2 --max-time 5 --retry-max-time 90 \
            http://127.0.0.1:3000/health > health.json
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          assert.equal(health.status, 'ok');
          assert.equal(health.database, 'connected');
          assert.equal(health.version, process.env.GITHUB_SHA);
          console.log('Container health, PostgreSQL connection and source version verified.');
          JS
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:3000/login > /dev/null

      - name: Run container smoke tests
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_EXPECTED_VERSION: ${{ github.sha }}
        run: node --test tests/smoke-test.js

      # Push the same image that passed the checks above.
      - name: Publish tested image to private Docker Hub
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_IMAGE:?Set the DOCKERHUB_IMAGE repository variable}"
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository variable}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN repository secret}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" --password-stdin
          docker tag "taskflow:$GITHUB_SHA" "$DOCKERHUB_IMAGE:$GITHUB_SHA"
          docker push "$DOCKERHUB_IMAGE:$GITHUB_SHA"

      - name: Show container logs
        if: ${{ always() }}
        run: |
          if docker container inspect taskflow-ci > /dev/null 2>&1; then
            docker logs taskflow-ci
          fi

      - name: Clean up
        if: ${{ always() }}
        run: |
          if docker container inspect taskflow-ci > /dev/null 2>&1; then
            docker rm --force taskflow-ci
          fi
          docker logout

  # Deploy the published image to staging (same EC2 instance, port 8080) and
  # verify it there before production. Production only runs after this passes.
  deploy-staging:
    needs: test-build-publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: taskflow-staging-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: Validate staging configuration
        run: |
          : "${AWS_REGION:?Set AWS_REGION}"
          : "${ROLE_ARN:?Set AWS_DEPLOY_ROLE_ARN}"
          : "${INSTANCE_ID:?Set EC2_INSTANCE_ID}"
          : "${STAGING_URL:?Set STAGING_URL, e.g. http://PUBLIC_IP:8080}"

      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy exact commit to staging and await verification
        shell: python
        run: |
          import json, os, re, subprocess, time
          sha = os.environ["GITHUB_SHA"]
          instance = os.environ["INSTANCE_ID"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha)
          def aws(*args):
              return subprocess.run(
                  ["aws", *args, "--output", "json"],
                  capture_output=True, text=True)
          sent = aws("ssm", "send-command",
              "--instance-ids", instance,
              "--document-name", "AWS-RunShellScript",
              "--timeout-seconds", "600",
              "--parameters", json.dumps({
                  "commands": [f"/opt/taskflow-staging/deploy.sh {sha}"],
                  "executionTimeout": ["600"]
              }))
          if sent.returncode:
              raise SystemExit(sent.stderr)
          command_id = json.loads(sent.stdout)["Command"]["CommandId"]
          print("SSM command:", command_id, flush=True)
          for _ in range(144):
              result = aws("ssm", "get-command-invocation",
                  "--command-id", command_id, "--instance-id", instance)
              if result.returncode:
                  if "InvocationDoesNotExist" in result.stderr:
                      time.sleep(5)
                      continue
                  raise SystemExit(result.stderr)
              invocation = json.loads(result.stdout)
              status = invocation["Status"]
              if status == "Success":
                  print(invocation.get("StandardOutputContent", ""))
                  print("Staging deployment verified:", sha)
                  break
              if status not in ("Pending", "InProgress", "Delayed"):
                  print(invocation.get("StandardOutputContent", ""))
                  print(invocation.get("StandardErrorContent", ""))
                  raise SystemExit("Remote staging deployment failed: " + status)
              time.sleep(5)
          else:
              raise SystemExit("Timed out awaiting staging deployment; check SSM command " + command_id)

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Checked from outside AWS, the way a real user reaches the site.
      - name: Run smoke tests against staging
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_URL }}
          SMOKE_EXPECTED_VERSION: ${{ github.sha }}
        run: node --test tests/smoke-test.js

  deploy:
    needs: deploy-staging
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: taskflow-production-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - name: Validate deployment configuration
        run: |
          : "${AWS_REGION:?Set AWS_REGION}"
          : "${ROLE_ARN:?Set AWS_DEPLOY_ROLE_ARN}"
          : "${INSTANCE_ID:?Set EC2_INSTANCE_ID}"
          test "$IMAGE_REPOSITORY" = khantthuaung/taskflow

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy exact commit and await verification
        shell: python
        run: |
          import json, os, re, subprocess, time
          sha = os.environ["GITHUB_SHA"]
          instance = os.environ["INSTANCE_ID"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha)
          def aws(*args):
              return subprocess.run(
                  ["aws", *args, "--output", "json"],
                  capture_output=True, text=True)
          sent = aws("ssm", "send-command",
              "--instance-ids", instance,
              "--document-name", "AWS-RunShellScript",
              "--timeout-seconds", "600",
              "--parameters", json.dumps({
                  "commands": [f"/opt/taskflow/deploy.sh {sha}"],
                  "executionTimeout": ["600"]
              }))
          if sent.returncode:
              raise SystemExit(sent.stderr)
          command_id = json.loads(sent.stdout)["Command"]["CommandId"]
          print("SSM command:", command_id, flush=True)
          for _ in range(144):
              result = aws("ssm", "get-command-invocation",
                  "--command-id", command_id, "--instance-id", instance)
              if result.returncode:
                  if "InvocationDoesNotExist" in result.stderr:
                      time.sleep(5)
                      continue
                  raise SystemExit(result.stderr)
              invocation = json.loads(result.stdout)
              status = invocation["Status"]
              if status == "Success":
                  print(invocation.get("StandardOutputContent", ""))
                  print("Deployment verified:", sha)
                  break
              if status not in ("Pending", "InProgress", "Delayed"):
                  print(invocation.get("StandardOutputContent", ""))
                  print(invocation.get("StandardErrorContent", ""))
                  raise SystemExit("Remote deployment failed: " + status)
              time.sleep(5)
          else:
              raise SystemExit("Timed out awaiting deployment; check SSM command " + command_id)

      - name: Verify public application health
        env:
          HEALTH_URL: http://56.70.14.130/health
        shell: python
        run: |
          import json, os, time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          url = os.environ["HEALTH_URL"]
          expected_version = os.environ["GITHUB_SHA"]
          for attempt in range(1, 13):
              try:
                  with urlopen(url, timeout=10) as response:
                      if response.status != 200:
                          raise ValueError(f"Unexpected HTTP status: {response.status}")
                      health = json.load(response)
                  if not isinstance(health, dict):
                      raise ValueError("Health response must be a JSON object")
                  if health.get("status") != "ok" or health.get("database") != "connected":
                      raise ValueError("Application or database is unhealthy")
                  if health.get("version") != expected_version:
                      raise ValueError(f"Expected version {expected_version}, got {health.get('version')}")
                  print("Public health check passed:", url)
                  print(json.dumps(health, indent=2))
                  break
              except (HTTPError, URLError, TimeoutError, OSError, ValueError) as error:
                  print(f"Health check {attempt}/12 failed: {error}", flush=True)
                  if attempt == 12:
                      raise SystemExit("Public application health verification failed")
                  time.sleep(5)
