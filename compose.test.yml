# Local, disposable PostgreSQL exclusively for Member 2 integration testing.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow_test
      POSTGRES_PASSWORD: taskflow_test_password
      POSTGRES_DB: taskflow_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_test -d taskflow_test"]
      interval: 2s
      timeout: 2s
      retries: 20
